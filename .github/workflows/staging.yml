name: Deploy — Staging

# Triggers on push to the 'stage' branch
on:
  push:
    branches:
      - stage

jobs:
  # ─────────────────────────────────────────────────────
  # 1. Type-check first — fail fast before touching the server
  # ─────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ─────────────────────────────────────────────────────
  # 2. Deploy to the staging EC2 instance
  # ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2 (Staging)
    needs: typecheck
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Strip git internals — we only need the source code on the server
      - name: Strip git metadata
        run: rm -rf .git .github .gitignore

      # Write the staging .env from the GitHub Secret onto the runner
      # so it gets SCP'd to the server along with the source code
      - name: Write .env for staging
        run: echo "${{ secrets.STAGING_ENV }}" > .env

      - name: Ensure ~/staging directory exists on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/staging
            test -w ~/staging && echo "✅ Dir writable" || (echo "❌ Not writable" && exit 1)

      - name: Upload source + .env via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: ~/staging

      - name: Install deps and restart PM2 (chainpaye-staging)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd ~/staging

            pnpm install --frozen-lockfile

            # Restart the existing PM2 process, or start it fresh if missing
            if pm2 show chainpaye-staging > /dev/null 2>&1; then
              pm2 restart ecosystem.config.js --only chainpaye-staging --update-env
            else
              pm2 start ecosystem.config.js --only chainpaye-staging
            fi

            pm2 save
            echo "✅ Staging deploy complete — $(date)"
