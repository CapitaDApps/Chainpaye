name: Deploy — Staging

on:
  push:
    branches:
      - staging

jobs:
  # ─────────────────────────────────────────────────────
  # 1. Type-check
  # ─────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ─────────────────────────────────────────────────────
  # 2. Deploy to EC2
  # ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2 (Staging)
    needs: typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Strip git metadata
        run: rm -rf .git .github .gitignore

      - name: Write .env for staging
        run: echo "${{ secrets.STAGING_ENV }}" | base64 -d > .env

      - name: Decode SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Ensure ~/staging exists on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /tmp/deploy_key
          script: mkdir -p ~/staging

      - name: Upload files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /tmp/deploy_key
          source: "."
          target: ~/staging

      - name: Install deps and restart PM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /tmp/deploy_key
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.local/share/pnpm:$PATH"

            cd ~/staging

            pnpm install --frozen-lockfile

            if pm2 show chainpaye-staging > /dev/null 2>&1; then
              pm2 restart ecosystem.config.js --only chainpaye-staging --update-env
            else
              pm2 start ecosystem.config.js --only chainpaye-staging
            fi

            pm2 save
            echo "✅ Staging deploy complete — $(date)"
