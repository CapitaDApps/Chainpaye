name: Deploy — Production

# Only triggers on push to 'main' — after staging has been tested
on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────
  # 1. Type-check + build
  # ─────────────────────────────────────────────────────
  build:
    name: Type Check & Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

      # Bundle everything the server needs into one artifact
      - name: Package release artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            dist/
            package.json
            pnpm-lock.yaml
            ecosystem.config.js
          retention-days: 1

  # ─────────────────────────────────────────────────────
  # 2. Deploy to the production EC2 instance
  # ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2 (Production)
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: release/

      # Write the production .env from the GitHub Secret
      - name: Write .env for production
        run: echo "${{ secrets.PRODUCTION_ENV }}" > release/.env

      - name: Ensure ~/app directory exists on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/app
            test -w ~/app && echo "✅ Dir writable" || (echo "❌ Not writable" && exit 1)

      - name: Upload release + .env via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "release/."
          target: ~/app

      - name: Install prod deps and reload PM2 (chainpaye-prod)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd ~/app

            # Production deps only — no devDependencies
            pnpm install --frozen-lockfile --prod

            # pm2 reload = graceful zero-downtime swap on cluster mode
            if pm2 show chainpaye-prod > /dev/null 2>&1; then
              pm2 reload ecosystem.config.js --only chainpaye-prod --update-env
            else
              pm2 start ecosystem.config.js --only chainpaye-prod
            fi

            pm2 save
            echo "✅ Production deploy complete — $(date)"
