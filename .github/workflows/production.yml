name: Deploy — Production

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Type Check & Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

      - name: Package release artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            dist/
            package.json
            pnpm-lock.yaml
            ecosystem.config.js
          retention-days: 1

  deploy:
    name: Deploy to EC2 (Production)
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: release/

      - name: Write .env for production
        run: echo "${{ secrets.PRODUCTION_ENV }}" | base64 -d > release/.env

      - name: Ensure ~/app exists on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/app

      - name: Upload files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "release/."
          target: ~/app

      - name: Install prod deps and reload PM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$HOME/.local/share/pnpm:$PATH"

            cd ~/app

            pnpm install --frozen-lockfile --prod

            if pm2 show chainpaye-prod > /dev/null 2>&1; then
              pm2 reload ecosystem.config.js --only chainpaye-prod --update-env
            else
              pm2 start ecosystem.config.js --only chainpaye-prod
            fi

            pm2 save
            echo "✅ Production deploy complete — $(date)"
